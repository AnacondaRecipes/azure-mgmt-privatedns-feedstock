{% set name = "azure-mgmt-privatedns" %}
{% set version = "1.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 34231872f01b94f6195d8ee5428e17469252ed04ea0828d52325ebe7bf0a120b

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<38]

requirements:
  host:
    - setuptools
    - wheel
    - python
    - pip
  run:
    - python
    - isodate >=0.6.1
    - typing_extensions >=4.6.0
    - azure-common >=1.1
    - azure-mgmt-core >=1.3.2

tests:
  imports:
    - azure.mgmt.privatedns
    - azure.mgmt.privatedns.aio
  commands:
    - pip check
  requires:
    - pip

about: 
  home: https://github.com/Azure/azure-sdk-for-python
  summary: Microsoft Azure DNS Private Zones Client Library for Python
  license: MIT
  license_file: LICENSE
  license_family: MIT
  description: Microsoft Azure DNS Private Zones Client Library for Python
  dev_url: https://github.com/Azure/azure-sdk-for-python
  doc_url: https://github.com/Azure/azure-sdk-for-python
  
